services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: etl-keycloak-container
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      # Database Configuration using .env variables
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # Public browser URL (nginx HTTPS proxy on :443). Issuer/OAuth endpoints use this host.
      KC_HOSTNAME: ${KC_HOSTNAME:-dtorch.online}
      # Admin console stays on host:8081 (not proxied through dtorch.online).
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-13.200.160.10}
      KC_HOSTNAME_ADMIN_PORT: ${KC_HOSTNAME_ADMIN_PORT:-8081}
      KC_HOSTNAME_ADMIN_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      
      # Initial Admin Credentials
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      
      # Networking
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    # Host 8081 (Jenkins uses host 8080). Container still listens on 8080 internally.
    ports:
      - "8081:8080"
    volumes:
      - ./realm-import:/opt/keycloak/data/import
