services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: etl-keycloak-container
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      # Database Configuration using .env variables
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # Keycloak 26 hostname v2: full URLs required (hostname + port cannot be split).
      # Public OAuth/issuer URLs (nginx HTTPS on :443).
      KC_HOSTNAME: ${KC_HOSTNAME:-https://dtorch.online}
      # Admin console on host :8081 (not proxied through the domain).
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://13.200.160.10:8081}
      KC_PROXY_HEADERS: xforwarded
      
      # Initial Admin Credentials
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      
      # Networking
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    # Host 8081 (Jenkins uses host 8080). Container still listens on 8080 internally.
    ports:
      - "8081:8080"
    volumes:
      - ./realm-import:/opt/keycloak/data/import
